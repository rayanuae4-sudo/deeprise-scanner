<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DeepRise Scanner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #07111f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 28px 18px;
      text-align: center;
      border-bottom: 1px solid #1c3047;
    }

    h1 {
      color: #35e0a1;
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      color: #8fa8bf;
      font-size: 14px;
    }

    .container {
      width: 94%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .status {
      background: #0c1929;
      border: 1px solid #1b3249;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .online {
      color: #35e0a1;
      font-weight: bold;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      background: #0c1929;
      border: 1px solid #1b3249;
      color: white;
      padding: 14px;
      border-radius: 10px;
      outline: none;
    }

    button {
      background: #35e0a1;
      color: #04110c;
      border: none;
      padding: 14px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .card {
      background: #0c1929;
      border: 1px solid #1b3249;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .coin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .symbol {
      font-size: 21px;
      font-weight: bold;
    }

    .score {
      background: #123a31;
      color: #35e0a1;
      padding: 7px 12px;
      border-radius: 20px;
      font-weight: bold;
    }

    .data {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .box {
      background: #081522;
      padding: 12px;
      border-radius: 9px;
    }

    .label {
      color: #7890a7;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .value {
      font-weight: bold;
    }

    .positive {
      color: #35e0a1;
    }

    .negative {
      color: #ff5f6d;
    }

    .loading {
      text-align: center;
      color: #8fa8bf;
      padding: 30px;
    }

    @media (max-width: 650px) {
      .data {
        grid-template-columns: repeat(2, 1fr);
      }

      .controls {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>DeepRise Scanner</h1>
  <p>Crypto Spot Opportunity Scanner</p>
</header>

<div class="container">

  <div class="status">
    <span>Market Scanner</span>
    <span class="online">● LIVE</span>
  </div>

  <div class="controls">
    <input
      id="search"
      type="text"
      placeholder="Search BTC, ETH, SOL..."
    />
    <button onclick="loadMarket()">SCAN NOW</button>
  </div>

  <div id="results">
    <div class="loading">Loading market data...</div>
  </div>

</div>

<script>
  let marketData = [];

  async function loadMarket() {
    const results = document.getElementById("results");

    results.innerHTML =
      '<div class="loading">Scanning Binance market...</div>';

    try {

      const response = await fetch(
        "https://api.binance.com/api/v3/ticker/24hr"
      );

      const data = await response.json();

      marketData = data
        .filter(c =>
          c.symbol.endsWith("USDT") &&
          !c.symbol.includes("UPUSDT") &&
          !c.symbol.includes("DOWNUSDT")
        )
        .sort(
          (a, b) =>
            Number(b.quoteVolume) - Number(a.quoteVolume)
        )
        .slice(0, 40);

      renderCoins(marketData);

    } catch (error) {

      results.innerHTML =
        '<div class="loading">Unable to load market data. Try again.</div>';

      console.error(error);
    }
  }

  function calculateScore(coin) {

    const change = Number(coin.priceChangePercent);
    const volume = Number(coin.quoteVolume);

    let score = 50;

    if (change > 0) score += 10;
    if (change > 3) score += 10;
    if (change > 7) score += 10;

    if (change < -3) score += 5;

    if (volume > 100000000) score += 10;
    if (volume > 500000000) score += 5;

    return Math.min(score, 100);
  }

  function formatVolume(volume) {

    const value = Number(volume);

    if (value >= 1000000000)
      return "$" + (value / 1000000000).toFixed(2) + "B";

    if (value >= 1000000)
      return "$" + (value / 1000000).toFixed(1) + "M";

    return "$" + value.toFixed(0);
  }

  function renderCoins(coins) {

    const results = document.getElementById("results");

    if (!coins.length) {
      results.innerHTML =
        '<div class="loading">No coins found.</div>';
      return;
    }

    results.innerHTML = "";

    coins.forEach(coin => {

      const change = Number(coin.priceChangePercent);
      const score = calculateScore(coin);

      const card = document.createElement("div");

      card.className = "card";

      card.innerHTML = `

        <div class="coin-header">

          <div class="symbol">
            ${coin.symbol.replace("USDT", "")}/USDT
          </div>

          <div class="score">
            Score ${score}
          </div>

        </div>

        <div class="data">

          <div class="box">
            <div class="label">PRICE</div>
            <div class="value">
              $${Number(coin.lastPrice).toLocaleString()}
            </div>
          </div>

          <div class="box">
            <div class="label">24H CHANGE</div>

            <div class="value ${
              change >= 0 ? "positive" : "negative"
            }">

              ${change >= 0 ? "+" : ""}
              ${change.toFixed(2)}%

            </div>
          </div>

          <div class="box">
            <div class="label">24H VOLUME</div>

            <div class="value">
              ${formatVolume(coin.quoteVolume)}
            </div>
          </div>

          <div class="box">
            <div class="label">24H LOW</div>

            <div class="value">
              $${Number(coin.lowPrice).toLocaleString()}
            </div>
          </div>

        </div>
      `;

      results.appendChild(card);
    });
  }

  document
    .getElementById("search")
    .addEventListener("input", function () {

      const q = this.value
        .toUpperCase()
        .replace("/", "")
        .replace("USDT", "");

      const filtered = marketData.filter(c =>
        c.symbol.startsWith(q)
      );

      renderCoins(filtered);
    });

  loadMarket();

  setInterval(loadMarket, 60000);
</script>

</body>
</html>
