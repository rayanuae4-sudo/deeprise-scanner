name: DeepRise Signal Results Upgrade
on:
  push:
    paths:
      - '.github/workflows/deeprise-signal-results.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add recommendation results dashboard
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<button data-menu="top">Top 3 Setups</button>','<button data-menu="top">Top 3 Setups</button>\n<button data-menu="signal-results">📊 Signal Results / نتائج التوصيات</button>')
          css='''\n.signal-results-panel{display:none;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}.signal-results-panel.active{display:block}.result-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.result-table{width:100%;border-collapse:collapse;font-size:12px}.result-table th,.result-table td{padding:10px 7px;border-bottom:1px solid var(--border);text-align:left}.result-table th{color:var(--muted);font-size:10px}.result-scroll{overflow-x:auto}@media(max-width:900px){.result-summary{grid-template-columns:repeat(2,1fr)}}\n'''
          s=s.replace('</style>',css+'</style>')
          panel='''\n<div id="signalResultsPanel" class="signal-results-panel">\n<div class="coin-head"><div><div class="sym">📊 نتائج التوصيات الثلاث</div><div class="small">Tracks the latest Top 3 signals from their original signal price.</div></div><button class="chart-btn chart-close" onclick="closeSignalResults()">✕ CLOSE</button></div>\n<div id="signalResultsSummary" class="result-summary"></div>\n<div id="signalResultsBody" class="result-scroll"><div class="loading">Run a Deep Scan to build signal history.</div></div>\n</div>\n'''
          s=s.replace('<div class="hero">\n<h2>🎯 DEEPRISE TOP SETUPS</h2>',panel+'<div class="hero">\n<h2>🎯 DEEPRISE TOP SETUPS</h2>')
          old='function signalMetrics(x,s){let z=s[x.symbol];if(!z)return null;let move=(x.price-z.entry)/z.entry*100;let best=z.direction==="LONG"?(z.high-z.entry)/z.entry*100:(z.entry-z.low)/z.entry*100;let worst=z.direction==="LONG"?(z.low-z.entry)/z.entry*100:(z.entry-z.high)/z.entry*100;let age=Math.max(0,Date.now()-z.created),mins=Math.floor(age/60000),ageTxt=mins<60?mins+"m":mins<1440?Math.floor(mins/60)+"h "+(mins%60)+"m":Math.floor(mins/1440)+"d "+Math.floor((mins%1440)/60)+"h";return{...z,move,best,worst,ageTxt}}'
          new='''function signalMetrics(x,s){let z=s[x.symbol];if(!z)return null;let move=(x.price-z.entry)/z.entry*100;let best=z.direction==="LONG"?(z.high-z.entry)/z.entry*100:(z.entry-z.low)/z.entry*100;let worst=z.direction==="LONG"?(z.low-z.entry)/z.entry*100:(z.entry-z.high)/z.entry*100;let age=Math.max(0,Date.now()-z.created),mins=Math.floor(age/60000),ageTxt=mins<60?mins+"m":mins<1440?Math.floor(mins/60)+"h "+(mins%60)+"m":Math.floor(mins/1440)+"d "+Math.floor((mins%1440)/60)+"h";return{...z,move,best,worst,ageTxt}}\nfunction elapsedText(ms){let m=Math.max(0,Math.floor(ms/60000));return m<60?m+"m":m<1440?Math.floor(m/60)+"h "+m%60+"m":Math.floor(m/1440)+"d "+Math.floor((m%1440)/60)+"h"}\nfunction renderSignalResults(){let s=readSignals(),rows=Object.values(s).sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,3);let live=Object.fromEntries(marketData.map(x=>[x.symbol,x]));let hit=rows.filter(x=>x.status==="TP1 HIT"||x.status==="TP2 HIT").length,stops=rows.filter(x=>x.status==="STOP HIT").length,active=rows.filter(x=>x.status==="ACTIVE").length,accuracy=rows.length?Math.round(hit/rows.length*100):0;document.getElementById("signalResultsSummary").innerHTML=`<div class="box"><div class="label">Tracked</div><div class="value blue">${rows.length}/3</div></div><div class="box"><div class="label">Targets Hit</div><div class="value green">${hit}</div></div><div class="box"><div class="label">Stopped / Active</div><div class="value yellow">${stops} / ${active}</div></div><div class="box"><div class="label">Accuracy</div><div class="value ${accuracy>=67?"green":accuracy>=34?"yellow":"red"}">${accuracy}%</div></div>`;if(!rows.length){document.getElementById("signalResultsBody").innerHTML='<div class="loading">No saved recommendations yet. Run DEEP SCAN first.</div>';return}document.getElementById("signalResultsBody").innerHTML=`<table class="result-table"><thead><tr><th>COIN</th><th>SIDE</th><th>SIGNAL</th><th>CURRENT</th><th>MOVE</th><th>TP1 / TP2</th><th>RESULT</th><th>ELAPSED</th></tr></thead><tbody>${rows.map(z=>{let x=live[z.symbol],cur=x?x.price:z.entry,raw=(cur-z.entry)/z.entry*100,move=z.direction==="SHORT"?-raw:raw,status=z.status||"ACTIVE",cls=status.includes("HIT")?"green":status.includes("STOP")?"red":"yellow";return `<tr><td><b>${z.symbol.replace("USDT","")}/USDT</b></td><td class="${z.direction==="LONG"?"green":"red"}">${z.direction}</td><td>$${priceFmt(z.entry)}</td><td>$${priceFmt(cur)}</td><td class="${move>=0?"green":"red"}">${move>=0?"+":""}${move.toFixed(2)}%</td><td>$${priceFmt(z.tp1)} / $${priceFmt(z.tp2)}</td><td class="${cls}"><b>${status}</b></td><td>${elapsedText(Date.now()-z.created)}</td></tr>`}).join("")}</tbody></table>`}\nfunction openSignalResults(){renderSignalResults();document.getElementById("signalResultsPanel").classList.add("active");setTimeout(()=>document.getElementById("signalResultsPanel").scrollIntoView({behavior:"smooth",block:"start"}),50)}\nfunction closeSignalResults(){document.getElementById("signalResultsPanel").classList.remove("active")}'''
          if old not in s: raise SystemExit('signalMetrics anchor not found')
          s=s.replace(old,new)
          anchor='if(f==="top"){document.querySelector(".hero").scrollIntoView({behavior:"smooth"});return}'
          s=s.replace(anchor,anchor+'if(f==="signal-results"){openSignalResults();return}')
          s=s.replace('updateBTC();render();renderTop();','updateBTC();render();renderTop();if(document.getElementById("signalResultsPanel").classList.contains("active"))renderSignalResults();')
          p.write_text(s,encoding='utf-8')
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Top 3 recommendation results dashboard"
          git push
