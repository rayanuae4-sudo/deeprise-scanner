name: DeepRise One-Time PostHog Ledger Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deeprise-ledger-posthog-reconcile-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified PostHog audit enrichments
        id: reconcile
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('forecast-ledger.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          updates = {
            '2026-08-29-AAVEUSDT': {
              'final_move': 0.6151574803149605,
              'end_reason': 'TP2 HIT',
            },
            '2026-08-29-PEPEUSDT': {
              'final_move': 0.81521739130434,
              'end_reason': 'TP2 HIT',
            },
          }
          immutable = {'created_at','entry','tp1','tp2','sl','symbol','side'}
          changed=[]
          by_id={r.get('forecast_id'):r for r in data.get('records',[])}
          for fid, vals in updates.items():
              row=by_id.get(fid)
              if not row:
                  raise SystemExit(f'Missing expected forecast_id: {fid}')
              for key in immutable:
                  if key in vals:
                      raise SystemExit(f'Attempt to mutate immutable field {key} for {fid}')
              for key,val in vals.items():
                  if row.get(key) != val:
                      row[key]=val
                      if fid not in changed:
                          changed.append(fid)
          if changed:
              data['generated_at']=datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
              path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/changed_ids.json').write_text(json.dumps(changed),encoding='utf-8')
          print('changed:', changed)
          PY
          CHANGED=$(cat /tmp/changed_ids.json)
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" = "[]" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast-ledger.json
          git commit -m "Synchronize DeepRise PostHog audit outcomes"
          git push origin HEAD:main
          echo "data_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp proof commits after data commit exists
        if: steps.reconcile.outputs.changed != '[]'
        env:
          DATA_SHA: ${{ steps.reconcile.outputs.data_sha }}
          CHANGED_IDS: ${{ steps.reconcile.outputs.changed }}
        run: |
          git pull --ff-only origin main
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path=Path('forecast-ledger.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          changed=set(json.loads(os.environ['CHANGED_IDS']))
          sha=os.environ['DATA_SHA']
          if len(sha) != 40:
              raise SystemExit('Invalid data commit SHA')
          stamp=datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
          found=set()
          for row in data.get('records',[]):
              fid=row.get('forecast_id')
              if fid in changed:
                  row['proof_commit']=sha
                  row['proof_verified_at']=stamp
                  found.add(fid)
          if found != changed:
              raise SystemExit(f'Proof stamping mismatch: missing {sorted(changed-found)}')
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git add forecast-ledger.json
          git commit -m "Stamp GitHub proof for synchronized DeepRise audit rows"
          git push origin HEAD:main
