name: DeepRise Trade + Coin Navigation Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deeprise-entry-mobile-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch bounded trade entry and coin navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Never let ENTER TRADE wait on an unbounded network analysis.
          p=Path('deeprise-trade-monitor-v14.js')
          s=p.read_text(encoding='utf-8')
          old="""async function enterTrade(symbol,btn){askNotifications();if(state.trades[symbol]){if(confirm(t('remove')+'?'))stopTrade(symbol);return}if(btn){btn.classList.add('busy');btn.textContent=t('working');btn.disabled=true}let a=analysisFor(symbol);try{a=await window.DeepRiseBinanceUniverse?.analyze?.(symbol,true)||a}catch(e){}if(btn)btn.disabled=false;if(!a||!['LONG','SHORT'].includes(a.direction)){toast(t('noEntry'),'yellow');if(btn)setButtonState(btn,symbol);return}state.trades[symbol]={symbol,side:a.direction,entry:+a.price,created:Date.now(),score:+a.score||0,lastScore:+a.score||0,sl:+a.sl,tp1:+a.tp1,tp2:+a.tp2,livePrice:+a.price,alerts:{},lastDirection:a.direction,status:'ACTIVE'};save();toast(t('entered'),'green');restartSocket();rebuildPanel();queueInject()}"""
          new="""async function enterTrade(symbol,btn){if(state.trades[symbol]){if(confirm(t('remove')+'?'))stopTrade(symbol);return}if(btn){btn.classList.add('busy');btn.textContent=t('working');btn.disabled=true}let a=analysisFor(symbol);try{if(!a&&window.DeepRiseBinanceUniverse?.analyze){const timeout=new Promise(resolve=>setTimeout(()=>resolve(null),3500));a=await Promise.race([Promise.resolve(window.DeepRiseBinanceUniverse.analyze(symbol,false)).catch(()=>null),timeout])}}catch(e){}finally{if(btn){btn.disabled=false;btn.classList.remove('busy')}}if(!a||!['LONG','SHORT'].includes(a.direction)){toast(t('noEntry'),'yellow');if(btn)setButtonState(btn,symbol);return}state.trades[symbol]={symbol,side:a.direction,entry:+a.price,created:Date.now(),score:+a.score||0,lastScore:+a.score||0,sl:+a.sl,tp1:+a.tp1,tp2:+a.tp2,livePrice:+a.price,alerts:{},lastDirection:a.direction,status:'ACTIVE'};save();toast(t('entered'),'green');restartSocket();rebuildPanel();queueInject();if(btn)setButtonState(btn,symbol);setTimeout(()=>{try{askNotifications()}catch(e){}},0)}"""
          if old not in s:
              raise SystemExit('enterTrade marker not found')
          s=s.replace(old,new,1).replace('DeepRise V14.3','DeepRise V14.4',1)
          p.write_text(s,encoding='utf-8')

          # 2) Make the whole coin card open the correct chart + current analysis.
          nav=r'''/* DeepRise V16.6 — reliable coin card -> chart + analysis navigation */
          (()=>{'use strict';
          function symFrom(card){
            let s=(card?.dataset?.drSymbol||card?.dataset?.symbol||'').toUpperCase();
            if(s)return s;
            const txt=card?.querySelector('.sym')?.textContent||'';
            const base=txt.split('/')[0].replace(/[^A-Z0-9]/gi,'').toUpperCase();
            return base?base+'USDT':'';
          }
          function current(sym){
            try{const a=window.DeepRiseBinanceUniverse?.state?.analyzed?.get?.(sym);if(a)return a}catch(e){}
            try{if(typeof marketData!=='undefined'&&Array.isArray(marketData))return marketData.find(x=>x.symbol===sym)||null}catch(e){}
            return null;
          }
          function sync(a){
            if(!a||!a.symbol)return;
            try{if(typeof marketData!=='undefined'&&Array.isArray(marketData)){const i=marketData.findIndex(x=>x.symbol===a.symbol);if(i>=0)marketData[i]=a;else marketData.unshift(a)}}catch(e){}
          }
          function refreshAnalysis(sym,a){
            sync(a);
            try{if(typeof updateChartAnalysis==='function')updateChartAnalysis(sym)}catch(e){}
          }
          function show(sym){
            if(!sym)return;
            const a=current(sym);sync(a);
            try{if(typeof openChart==='function')openChart(sym)}catch(e){}
            const panel=document.getElementById('chartPanel');
            if(panel){panel.classList.add('active');requestAnimationFrame(()=>panel.scrollIntoView({behavior:'auto',block:'start'}))}
            if(a){refreshAnalysis(sym,a);return}
            try{const fn=window.DeepRiseBinanceUniverse?.analyze;if(fn)Promise.resolve(fn(sym,false)).then(x=>{if(x)refreshAnalysis(sym,x)}).catch(()=>{})}catch(e){}
          }
          function decorate(){document.querySelectorAll('#results .card,#top3 .pick').forEach(card=>{card.classList.add('dr-coin-clickable');if(!card.getAttribute('role'))card.setAttribute('role','button');if(!card.hasAttribute('tabindex'))card.tabIndex=0})}
          let tm=null;const queue=()=>{clearTimeout(tm);tm=setTimeout(decorate,80)};
          document.addEventListener('click',e=>{
            if(e.target.closest('button,input,select,textarea,a,[data-stop-trade],[data-trade-open],.dr-enter-trade,.filter,.chart-btn'))return;
            const card=e.target.closest('#results .card,#top3 .pick');if(!card)return;
            const sym=symFrom(card);if(!sym)return;
            e.preventDefault();e.stopPropagation();show(sym);
          },true);
          document.addEventListener('keydown',e=>{if(!['Enter',' '].includes(e.key))return;const card=e.target.closest('#results .card,#top3 .pick');if(!card||e.target.closest('button,input,select,textarea,a'))return;e.preventDefault();show(symFrom(card))});
          const css=document.createElement('style');css.textContent='.dr-coin-clickable{cursor:pointer;touch-action:manipulation}.dr-coin-clickable:active{transform:translateY(1px)}';document.head.appendChild(css);
          if(document.readyState==='loading')addEventListener('DOMContentLoaded',()=>{decorate();const r=document.getElementById('results'),t=document.getElementById('top3');if(r)new MutationObserver(queue).observe(r,{childList:true,subtree:true});if(t)new MutationObserver(queue).observe(t,{childList:true,subtree:true})},{once:true});else decorate();
          window.DeepRiseOpenCoin=show;
          })();
          '''
          Path('deeprise-card-chart-v166.js').write_text(nav.strip()+"\n",encoding='utf-8')

          # 3) Load the two interaction fixes exactly once and bust mobile/PWA cache.
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          oldref='<script defer src="deeprise-trade-monitor-v14.js?v=1652"></script>'
          newref='<script defer src="deeprise-trade-monitor-v14.js?v=1653"></script><script defer src="deeprise-card-chart-v166.js?v=1660"></script>'
          if oldref in s:s=s.replace(oldref,newref,1)
          elif 'deeprise-card-chart-v166.js' not in s:raise SystemExit('trade monitor script marker not found')
          p.write_text(s,encoding='utf-8')

          p=Path('stable-loader.js');s=p.read_text(encoding='utf-8')
          s=s.replace('DeepRise Stable Loader v16.5.2','DeepRise Stable Loader v16.5.3')
          s=s.replace('./index.html?stable=16.5.2&t=','./index.html?stable=16.5.3&t=')
          p.write_text(s,encoding='utf-8')

          p=Path('stable.html');s=p.read_text(encoding='utf-8').replace('stable-loader.js?v=1652','stable-loader.js?v=1653');p.write_text(s,encoding='utf-8')
          p=Path('manifest.json');s=p.read_text(encoding='utf-8').replace('./stable.html?source=pwa&v=16.5.2','./stable.html?source=pwa&v=16.5.3');p.write_text(s,encoding='utf-8')
          p=Path('recover.html');s=p.read_text(encoding='utf-8').replace('./stable.html?source=repair&v=16.5.2&t=','./stable.html?source=repair&v=16.5.3&t=');p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check deeprise-trade-monitor-v14.js
          node --check deeprise-card-chart-v166.js
          node --check deeprise-v13-gate-hotfix.js
          node --check stable-loader.js

      - name: Start local app
        run: |
          python3 -m http.server 4173 >/tmp/deeprise-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          curl -fsS http://127.0.0.1:4173/stable.html >/dev/null

      - name: Install Selenium
        run: python3 -m pip install --quiet selenium

      - name: Test iPhone trade response and coin chart navigation
        run: |
          python3 - <<'PY'
          import shutil,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser');assert chrome
          o=Options();o.binary_location=chrome
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=390,844']:o.add_argument(a)
          o.add_argument('--user-agent=Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1')
          d=webdriver.Chrome(options=o);w=WebDriverWait(d,90)

          def check(url):
              d.get(url)
              d.execute_script("localStorage.removeItem('deeprise_active_trades_v14')")
              d.refresh()
              w.until(EC.presence_of_element_located((By.ID,'search')))
              w.until(lambda x:x.execute_script('return !!window.DeepRiseBinanceUniverse'))
              w.until(lambda x:x.execute_script('return window.DeepRiseBinanceUniverse.state.symbols.length')>=20)
              w.until(lambda x:x.execute_script("return [...document.scripts].some(s=>s.src.includes('deeprise-card-chart-v166.js'))"))

              search=d.find_element(By.ID,'search'); search.click(); search.send_keys('BTC')
              w.until(lambda x:'BTC/USDT' in x.find_element(By.ID,'results').text)
              w.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'#results .card'))>=1)
              w.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'#results .dr-enter-trade'))>=1)

              # Tap the coin card, not merely the name. It must open the matching chart
              # and populate the chart analysis from the search result.
              card=d.find_element(By.CSS_SELECTOR,'#results .card')
              head=card.find_element(By.CSS_SELECTOR,'.coin-head')
              d.execute_script('arguments[0].click()',head)
              w.until(lambda x:'active' in x.find_element(By.ID,'chartPanel').get_attribute('class'))
              w.until(lambda x:'BTC/USDT' in x.find_element(By.ID,'chartTitle').text)
              w.until(lambda x:x.find_element(By.ID,'forecastDirection').text.strip() not in ('','Select a coin'))
              assert d.execute_script("return document.getElementById('chartPanel').getBoundingClientRect().top") < 850
              d.execute_script("closeChart()")

              # ENTER TRADE must resolve quickly: active monitoring or a clear no-entry
              # message, and the button must never remain disabled/busy.
              btn=d.find_element(By.CSS_SELECTOR,'#results .dr-enter-trade')
              start=time.time();d.execute_script('arguments[0].click()',btn)
              WebDriverWait(d,6).until(lambda x:x.execute_script("return !!document.querySelector('#dr-active-trades-panel') || !!document.querySelector('#dr-trade-toast.show')"))
              elapsed=time.time()-start
              assert elapsed<5.5,elapsed
              WebDriverWait(d,2).until(lambda x:not x.find_element(By.CSS_SELECTOR,'#results .dr-enter-trade').get_attribute('disabled'))
              cls=d.find_element(By.CSS_SELECTOR,'#results .dr-enter-trade').get_attribute('class')
              assert 'busy' not in cls,cls

              t=time.time();state=d.execute_script('return document.readyState');dt=time.time()-t
              assert state in ('interactive','complete') and dt<2,(state,dt)

          check('http://127.0.0.1:4173/index.html?smoke=1653')
          print('ROOT TRADE + CARD CHART PASS',flush=True)
          check('http://127.0.0.1:4173/stable.html?smoke=1653')
          print('STABLE TRADE + CARD CHART PASS',flush=True)
          d.quit()
          PY

      - name: Commit runtime only after PASS
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html deeprise-trade-monitor-v14.js deeprise-card-chart-v166.js stable-loader.js stable.html manifest.json recover.html
          git commit -m 'Fix trade button hang and coin chart navigation'
          git pull --rebase origin main
          git push
