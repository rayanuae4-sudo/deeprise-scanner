name: DeepRise V14.8 Launch Check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.json'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          for f in deeprise-v86-upgrade.js deeprise-intelligence-v11.js deeprise-v12-experience.js deeprise-analytics-config.js deeprise-analytics.js deeprise-central-ledger.js deeprise-v13-product.js deeprise-central-forecast-bridge.js deeprise-predictive-intelligence.js deeprise-performance.js deeprise-v13-gate-hotfix.js deeprise-next-candle-v145.js deeprise-forecast-safety-v145.js deeprise-ui-v146.js deeprise-whale-radar-v147.js deeprise-public-liquidity-v148.js deeprise-trade-monitor-v14.js mobile-app-v11.js pwa.js sw.js; do
            node --check "$f"
          done

      - name: Validate direct production index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert len(s)>45000, 'index.html is not the direct scanner runtime'
          assert 'document.write' not in s, 'legacy document.write loader detected'
          assert 'https://data-api.binance.vision' in s, 'stable Binance spot endpoint missing'
          assert 'deeprise-predictive-intelligence.js' in s, 'predictive UI is not loaded'
          PY

      - name: Validate Python and JSON
        run: |
          python3 -m py_compile scripts/maintain_ledger.py scripts/publish_forecasts.py scripts/enrich_smart_money.py scripts/apply_trap_gate.py scripts/publish_liquidity_alerts.py scripts/publish_whale_radar.py scripts/publish_public_liquidity.py scripts/apply_whale_gate.py
          python3 - <<'PY'
          import json
          for f in ['manifest.json','forecast-ledger.json','market-alerts.json','whale-radar.json','public-liquidity.json']:
              with open(f,encoding='utf-8') as h: json.load(h)
          PY

      - name: Verify predictive market-data path from GitHub runner
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        run: python3 scripts/publish_forecasts.py health

      - name: Assert V14.8 public-data and predictive wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pwa=Path('pwa.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          manifest=Path('manifest.json').read_text(encoding='utf-8')
          whale=Path('scripts/publish_whale_radar.py').read_text(encoding='utf-8')
          gate=Path('scripts/apply_whale_gate.py').read_text(encoding='utf-8')
          wui=Path('deeprise-whale-radar-v147.js').read_text(encoding='utf-8')
          pub=Path('scripts/publish_public_liquidity.py').read_text(encoding='utf-8')
          pui=Path('deeprise-public-liquidity-v148.js').read_text(encoding='utf-8')
          sm=Path('scripts/enrich_smart_money.py').read_text(encoding='utf-8')
          wf=Path('.github/workflows/deeprise-ledger-maintenance.yml').read_text(encoding='utf-8')
          assert 'DeepRise V14.8 PRO' in pwa and 'stable-v14-8' in pwa
          assert "deeprise-pwa-stable-v14-8" in sw and './public-liquidity.json' in sw and './deeprise-public-liquidity-v148.js' in sw
          assert 'DeepRise Scanner V14.8 PRO' in manifest
          for marker in ['api.geckoterminal.com','tx_from_address','trade_volume_in_usd_greater_than','rotation_in_30m','arrival_score','distribution_score','NANSEN_API_KEY']:
              assert marker in whale, f'whale radar missing {marker}'
          for marker in ['PUBLIC_WHALE_FLOW_CONFLICT','conflict>=88','whale_arrival_radar']:
              assert marker in gate, f'whale gate missing {marker}'
          for marker in ['Whale Arrival Radar','whale-radar.json','top_buy_wallets','fresh_large_buyers_30m']:
              assert marker in wui, f'whale UI missing {marker}'
          for marker in ['data-api.binance.vision','/api/v3/depth','volume-at-price concentration proxy','not a liquidation heatmap']:
              assert marker in pub, f'public liquidity publisher missing {marker}'
          for marker in ['Public Liquidity Fallback','public-liquidity.json','PUBLIC PROXY','not a CoinGlass liquidation heatmap']:
              assert marker in pui, f'public liquidity UI missing {marker}'
          for marker in ['NANSEN_API_KEY','smart-money/netflow','wallet_confirmed']:
              assert marker in sm, f'wallet intelligence missing {marker}'
          for marker in ['scripts/publish_whale_radar.py','scripts/publish_public_liquidity.py','scripts/apply_whale_gate.py','public-liquidity.json','NANSEN_API_KEY','COINGLASS_API_KEY','contents: write']:
              assert marker in wf, f'central workflow missing {marker}'
          PY
