name: DeepRise V13.3 Launch Check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - '*.json'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          for f in deeprise-v86-upgrade.js deeprise-intelligence-v11.js deeprise-v12-experience.js deeprise-analytics-config.js deeprise-analytics.js deeprise-central-ledger.js deeprise-v13-product.js deeprise-central-forecast-bridge.js deeprise-predictive-intelligence.js deeprise-performance.js deeprise-v13-gate-hotfix.js mobile-app-v11.js pwa.js sw.js; do
            node --check "$f"
          done

      - name: Validate direct production index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert len(s)>45000, 'index.html is not the direct scanner runtime'
          assert 'document.write' not in s, 'legacy document.write loader detected'
          assert 'https://data-api.binance.vision' in s, 'stable Binance spot endpoint missing'
          assert 'deeprise-predictive-intelligence.js' in s, 'predictive UI is not loaded'
          PY

      - name: Validate Python and JSON
        run: |
          python3 -m py_compile scripts/maintain_ledger.py scripts/publish_forecasts.py scripts/enrich_smart_money.py scripts/apply_trap_gate.py scripts/publish_liquidity_alerts.py
          python3 - <<'PY'
          import json
          for f in ['manifest.json','forecast-ledger.json','market-alerts.json']:
              with open(f,encoding='utf-8') as h: json.load(h)
          PY

      - name: Verify predictive market-data path from GitHub runner
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        run: python3 scripts/publish_forecasts.py health

      - name: Assert production V13.3 predictive wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text(encoding='utf-8')
          cfg=Path('deeprise-analytics-config.js').read_text(encoding='utf-8')
          pwa=Path('pwa.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          manifest=Path('manifest.json').read_text(encoding='utf-8')
          bridge=Path('deeprise-central-forecast-bridge.js').read_text(encoding='utf-8')
          pi=Path('deeprise-predictive-intelligence.js').read_text(encoding='utf-8')
          pub=Path('scripts/publish_forecasts.py').read_text(encoding='utf-8')
          sm=Path('scripts/enrich_smart_money.py').read_text(encoding='utf-8')
          trap=Path('scripts/apply_trap_gate.py').read_text(encoding='utf-8')
          alerts=Path('scripts/publish_liquidity_alerts.py').read_text(encoding='utf-8')
          maint=Path('scripts/maintain_ledger.py').read_text(encoding='utf-8')
          wf=Path('.github/workflows/deeprise-ledger-maintenance.yml').read_text(encoding='utf-8')
          required=['deeprise-central-forecast-bridge.js','deeprise-predictive-intelligence.js','deeprise-performance.js']
          assert not [x for x in required if x not in idx]
          assert "version: 'V13.3 PRO'" in cfg
          assert 'DeepRise V13.3 PRO' in pwa and 'stable-v13-6' in pwa
          assert "deeprise-pwa-stable-v13-6" in sw and './market-alerts.json' in sw
          assert 'DeepRise Scanner V13.3 PRO' in manifest
          assert 'Block local-only official forecast writes' in bridge
          for marker in ['order_flow_intelligence','liquidity_proxy_intelligence','predictive_confluence','COINGLASS_API_KEY']:
              assert marker in pub, f'predictive engine missing {marker}'
          for marker in ['NANSEN_API_KEY','smart-money/netflow','whale_divergence','wallet_confirmed']:
              assert marker in sm, f'whale intelligence missing {marker}'
          for marker in ['BUY_SIDE_SWEEP_CONFIRMED','UPWARD_LIQUIDITY_SWEEP_RISK','blocks newly-created LONG']:
              assert marker in trap, f'trap gate missing {marker}'
          for marker in ['UPWARD_LIQUIDITY_SWEEP_RISK','BUY_SIDE_SWEEP_CONFIRMED','trap_score','closed 5m + 15m']:
              assert marker in alerts, f'central sweep alerts missing {marker}'
          for marker in ['market-alerts.json','تنبيهات سحب السيولة','Whale Divergence','Notification.requestPermission']:
              assert marker in pi, f'UI alert wiring missing {marker}'
          assert 'data-api.binance.vision' in pub and 'data-api.binance.vision' in maint and 'data-api.binance.vision' in alerts
          for marker in ['COINGLASS_API_KEY','NANSEN_API_KEY','scripts/apply_trap_gate.py','scripts/publish_liquidity_alerts.py','market-alerts.json','contents: write']:
              assert marker in wf, f'central workflow missing {marker}'
          PY
