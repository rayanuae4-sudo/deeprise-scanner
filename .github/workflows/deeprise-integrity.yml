name: DeepRise V15.7 Integrity Gate

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check all JavaScript
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done

      - name: Run production entry regression
        run: node scripts/deeprise-entry-regression.js

      - name: Run whale-flow regression
        run: node scripts/deeprise-whale-flow-regression.js

      - name: Verify V15.7 runtime and PWA wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pwa=Path('pwa.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          integrity=Path('deeprise-integrity-v155.js').read_text(encoding='utf-8')
          entry=Path('deeprise-entry-ranking-v155.js').read_text(encoding='utf-8')
          flow=Path('deeprise-whale-flow-v155.js').read_text(encoding='utf-8')
          inline=Path('deeprise-whale-inline-v156.js').read_text(encoding='utf-8')
          zones=Path('deeprise-trade-zones-v157.js').read_text(encoding='utf-8')
          ui=Path('deeprise-signal-card-ui-v153.js').read_text(encoding='utf-8')
          for marker in ['deeprise-whale-flow-v155.js?v=1550','deeprise-entry-ranking-v155.js?v=1550','deeprise-integrity-v155.js?v=1550','deeprise-signal-card-ui-v153.js?v=1531','deeprise-whale-inline-v156.js?v=1560','deeprise-trade-zones-v157.js?v=1570']:
              assert marker in pwa, f'pwa.js missing {marker}'
          assert 'stable-v15-7' in pwa, 'service-worker registration not bumped to V15.7'
          assert "deeprise-pwa-stable-v15-7" in sw, 'service-worker cache is not V15.7'
          for f in ['./deeprise-whale-flow-v155.js','./deeprise-entry-ranking-v155.js','./deeprise-integrity-v155.js','./deeprise-signal-card-ui-v153.js','./deeprise-whale-inline-v156.js','./deeprise-trade-zones-v157.js']:
              assert f in sw, f'{f} missing from PWA core cache'
          for marker in ['strictReady','fastTrack','FAST_TRACK','whaleFlow','whaleConflict','flowAssist','entryAllowed']:
              assert marker in entry, f'entry invariant missing: {marker}'
          for marker in ['Whale Money Flow Predictor','anomalyScore','ARRIVAL_CONFIRMED','BUY_LIKELY','ROTATION','MOBILIZING','support','selfTest']:
              assert marker in flow, f'whale-flow predictor missing: {marker}'
          for marker in ["DeepRiseEntryRank?.version==='15.5'",'optional whale-flow module unavailable','whale-flow self-test failed','whale-flow source stale >4h','S.blockTrading=issues.length>0']:
              assert marker in integrity, f'integrity monitor missing: {marker}'
          for marker in ['Whale accumulation detected','Possible move in','DeepRiseWhaleInlineV156']:
              assert marker in inline, f'inline whale alert missing: {marker}'
          for marker in ['Trade Zone Advisor','BUY / RELOAD ZONE','DISTRIBUTION / TAKE-PROFIT','DeepRiseTradeZonesV157','buyZone','distributionZone','DeepRiseWhaleFlowV155?.support']:
              assert marker in zones, f'trade-zone advisor missing: {marker}'
          for marker in ['Signal Quality:','dr-quality-pills','DeepRiseEntryRank']:
              assert marker in ui, f'signal-quality UI missing: {marker}'
          print('DeepRise V15.7 integrity + whale-flow + trade-zone wiring: PASS')
          PY
