name: DeepRise Stability Integrity Gate

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check all JavaScript
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done

      - name: Run V15.8 entry regression
        run: node scripts/deeprise-entry-regression.js

      - name: Run V15.8 move-timing regression
        run: node scripts/deeprise-move-timing-regression.js

      - name: Run whale-flow regression
        run: node scripts/deeprise-whale-flow-regression.js

      - name: Run V17 pre-move regression
        run: node scripts/deeprise-pre-move-regression.js

      - name: Run V17.1 signal stability regression
        run: node scripts/deeprise-signal-stability-regression.js

      - name: Run V17.2 market structure regression
        run: node scripts/deeprise-structure-regression.js

      - name: Run V17.3 chart workspace regression
        run: node scripts/deeprise-workspace-regression.js

      - name: Run V17.4 order-block and chart regression
        run: node scripts/deeprise-order-block-regression.js

      - name: Run V18.1 strict SMC workflow regression
        run: node scripts/deeprise-smc-sequence-regression.cjs

      - name: Install chart interaction test dependency
        run: npm install --no-save --no-package-lock jsdom@26

      - name: Test real indicator button clicks and fullscreen DOM behavior
        run: node scripts/chart-click-regression.cjs

      - name: Test explanations, Arabic reasons and chart navigation
        run: |
          node scripts/deeprise-explain-regression.cjs
          node scripts/deeprise-tradingview-regression.cjs

      - name: Verify runtime and cacheless PWA wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pwa=Path('pwa.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          timing=Path('deeprise-move-timing-v158.js').read_text(encoding='utf-8')
          entry=Path('deeprise-entry-ranking-v158.js').read_text(encoding='utf-8')
          integrity=Path('deeprise-integrity-v158.js').read_text(encoding='utf-8')
          flow=Path('deeprise-whale-flow-v155.js').read_text(encoding='utf-8')
          inline=Path('deeprise-whale-inline-v156.js').read_text(encoding='utf-8')
          zones=Path('deeprise-trade-zones-v157.js').read_text(encoding='utf-8')
          ui=Path('deeprise-signal-card-ui-v153.js').read_text(encoding='utf-8')
          premove=Path('deeprise-pre-move-v170.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          for marker in ['deeprise-workspace-v173.js?v=1850','deeprise-market-structure-v174.js?v=1850','deeprise-structure-chart-v174.js?v=1884']:
              assert marker in index and marker in sw, f'structure asset missing: {marker}'
          assert index.index('deeprise-market-structure-v174.js') < index.index('deeprise-pre-move-v170.js')
          assert index.index('deeprise-structure-chart-v174.js') > index.index('deeprise-v13-gate-hotfix.js')
          for asset in ['deeprise-structure-explain-v182.js?v=1820','deeprise-structure-reasons-v182.js?v=1820']:
              assert asset in index and asset in sw, f'missing rationale asset: {asset}'
          chart=Path('deeprise-structure-chart-v174.js').read_text(encoding='utf-8')
          for feature in ['function updateLayer(key,enabled)', 'data-toggle-indicator', 'data-structure-fullscreen', 'function toggleFullscreen(force)', 'dr-structure-fullscreen']:
              assert feature in chart, f'v17.5 interactive chart feature missing: {feature}'
          for marker in ['deeprise-move-timing-v158.js?v=1580','deeprise-entry-ranking-v158.js?v=1850','deeprise-integrity-v158.js?v=1580','deeprise-whale-flow-v155.js?v=1550','deeprise-signal-card-ui-v153.js?v=1531','deeprise-whale-inline-v156.js?v=1560','deeprise-trade-zones-v157.js?v=1570']:
              assert marker in pwa, f'pwa.js missing {marker}'
          assert 'network-v18-8-4' in pwa, 'service-worker network-only registration missing'
          assert "deeprise-pwa-network-v18-8-4" in sw, 'service-worker network cache missing'
          for marker in ['./deeprise-fast-search-v160.js?v=1601','./deeprise-v13-gate-hotfix.js?v=1730','./deeprise-pre-move-v170.js?v=1730','./deeprise-signal-stability-v171.js?v=1710','./mobile-app-v11.js?v=1800','./pwa.js?v=1884','networkOnlyNavigation','offlinePage']:
              assert marker in sw, f'cacheless service-worker wiring missing: {marker}'
          assert "event.request.mode==='navigate'" in sw
          assert "cache:'no-store'" in sw
          for marker in ['POTENTIAL MOVE STARTING','MOVE EXTENDED — DO NOT CHASE','EARLY_START','EXTENDED','RELOAD','@kline_1m','excursionAtr','givebackAtr','earlyStrong','selfTest']:
              assert marker in timing, f'move timing missing: {marker}'
          for marker in ['strictReady','fastTrack','EARLY_FLOW','timingAssist','timingSafe','entryAllowed','patchAnalyze','whaleFlow','whaleConflict']:
              assert marker in entry, f'entry invariant missing: {marker}'
          for marker in ["DeepRiseEntryRank?.version==='15.8'","DeepRiseMoveTimingV158?.version==='15.8'",'move-timing self-test failed','S.blockTrading=issues.length>0']:
              assert marker in integrity, f'integrity monitor missing: {marker}'
          for marker in ['Whale Money Flow Predictor','anomalyScore','ARRIVAL_CONFIRMED','BUY_LIKELY','ROTATION','MOBILIZING','support','selfTest']:
              assert marker in flow, f'whale-flow predictor missing: {marker}'
          for marker in ['Whale accumulation detected','Possible move in','DeepRiseWhaleInlineV156']:
              assert marker in inline, f'inline whale alert missing: {marker}'
          for marker in ['Trade Zone Advisor','BUY / RELOAD ZONE','DISTRIBUTION / TAKE-PROFIT','DeepRiseTradeZonesV157','buyZone','distributionZone','DeepRiseWhaleFlowV155?.support']:
              assert marker in zones, f'trade-zone advisor missing: {marker}'
          for marker in ['Signal Quality:','dr-quality-pills','DeepRiseEntryRank']:
              assert marker in ui, f'signal-quality UI missing: {marker}'
          for marker in ['PRE-MOVE RADAR','ARMED','IGNITION','LATE','interval=4h','MAX_COINS=120','extended']:
              assert marker in premove, f'pre-move engine missing: {marker}'
          print('DeepRise stability integrity + cacheless PWA wiring: PASS')
          PY
