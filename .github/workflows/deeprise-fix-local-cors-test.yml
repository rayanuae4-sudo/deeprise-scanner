name: Adjust DeepRise Local Test Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deeprise-fix-local-cors-test.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deeprise-final-runtime-repair.yml')
          s=p.read_text(encoding='utf-8')
          old="['favicon','tradingview','ERR_BLOCKED_BY_CLIENT','ERR_CONNECTION_CLOSED']"
          new="['favicon','tradingview','ERR_BLOCKED_BY_CLIENT','ERR_CONNECTION_CLOSED','api.binance.com','fapi.binance.com']"
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deeprise-final-runtime-repair.yml
          git commit -m 'Ignore expected Binance CORS noise in local browser gate'
          git pull --rebase origin main
          git push
