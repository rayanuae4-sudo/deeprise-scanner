name: Restore index after notification patch
on:
  push:
    paths:
      - '.github/workflows/restore-index.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index and add notification center directly
        run: |
          git show af9fee1fe97cec80a2be0c6143417c9f4f6561f4:index.html > index.html
          python3 - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8').read()
          needle='<script src="deeprise-fast-search-v160.js?v=1651"></script>'
          repl='<script src="deeprise-fast-search-v160.js?v=1651"></script><script defer src="deeprise-notification-center-v167.js?v=1671"></script>'
          if needle not in s: raise SystemExit('script insertion point not found')
          s=s.replace(needle,repl,1)
          open(p,'w',encoding='utf-8').write(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix notification center direct loading on PWA'
          git push