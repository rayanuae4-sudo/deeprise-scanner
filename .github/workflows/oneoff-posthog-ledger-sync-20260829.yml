name: One-off PostHog Ledger Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-posthog-ledger-sync-20260829.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply authoritative PostHog lifecycle and audit enrichment
        id: data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('forecast-ledger.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          rows = d.get('records', [])
          by_id = {r.get('forecast_id'): r for r in rows if r.get('forecast_id')}

          audit = {
            '2026-08-28-SUIUSDT': dict(status='STOP HIT', current=0.7433, high=0.7436, low=0.7315, final_move=-1.5853491868251939, best_move=0.027333606669397017, worst_move=-1.6263495968293045, end_reason='STOP HIT', ended_at='2026-08-28T23:14:59.999Z'),
            '2026-08-28-PEPEUSDT': dict(status='STOP HIT', current=3.7e-06, high=3.71e-06, low=3.64e-06, final_move=-1.648351648351656, best_move=0.0, worst_move=-1.923076923076928, end_reason='STOP HIT', ended_at='2026-08-29T00:05:59.999Z'),
            '2026-08-28-CRCLBUSDT': dict(status='STOP HIT', current=87.89, high=88.04, low=87.05, final_move=-0.9417709888595468, best_move=0.02297002411852076, worst_move=-1.1140461697484934, end_reason='STOP HIT', ended_at='2026-08-28T19:28:59.999Z'),
            '2026-08-28-DEXEUSDT': dict(status='TP2 HIT', current=2.683, high=2.689, low=2.194, final_move=17.417943107220992, best_move=17.68052516411378, worst_move=-3.9824945295404897, end_reason='TP2 HIT', tp1_hit_at='2026-08-28T22:03:59.999Z', tp2_hit_at='2026-08-29T01:58:59.999Z', ended_at='2026-08-29T01:58:59.999Z'),
            '2026-08-29-TRUMPUSDT': dict(status='STOP HIT', current=2.758, high=2.809, low=2.753, final_move=-1.3237924865831814, best_move=0.5008944543828349, worst_move=-1.5026833631484728, end_reason='STOP HIT', ended_at='2026-08-29T00:36:59.999Z'),
            '2026-08-29-ZECUSDT': dict(status='STOP HIT', current=801.28, high=806.18, low=801.28, final_move=-0.6041059356199224, best_move=0.003721391800530015, worst_move=-0.6041059356199224, end_reason='STOP HIT', ended_at='2026-08-29T00:47:59.999Z'),
            '2026-08-29-TAOUSDT': dict(status='STOP HIT', current=236.9, high=236.9, low=234.7, final_move=-0.765631646108044, best_move=0.17014036580178887, worst_move=-0.765631646108044, end_reason='STOP HIT', ended_at='2026-08-29T01:24:59.999Z'),
            '2026-08-29-AAVEUSDT': dict(status='TP1 HIT', current=121.6, high=122.31, low=121.33, best_move=0.4839238845144385, worst_move=-0.31988188976378, tp1_hit_at='2026-08-29T01:15:59.999Z'),
          }

          terminal = lambda s: any(x in str(s or '').upper() for x in ('TP2', 'STOP', 'TIME EXPIRED', 'EXPIRED'))
          rank = {'ACTIVE':0, 'TP1 HIT':1, 'TP2 HIT':2, 'STOP HIT':2, 'STOP AFTER TP1':2, 'TIME EXPIRED':2}
          changed = []

          for fid, u in audit.items():
              r = by_id.get(fid)
              if not r:
                  continue
              before = json.dumps(r, sort_keys=True, separators=(',', ':'))
              cur_status = str(r.get('status') or 'ACTIVE').upper()
              new_status = str(u.get('status') or cur_status).upper()
              if not terminal(cur_status) and rank.get(new_status, 0) >= rank.get(cur_status, 0):
                  r['status'] = u['status']
              elif cur_status == new_status:
                  r['status'] = u['status']

              for k in ('final_move','end_reason','tp1_hit_at','tp2_hit_at','ended_at'):
                  if k in u and u[k] is not None and r.get(k) != u[k]:
                      r[k] = u[k]

              if u.get('high') is not None:
                  r['high'] = max(float(r.get('high', u['high'])), float(u['high']))
              if u.get('low') is not None:
                  r['low'] = min(float(r.get('low', u['low'])), float(u['low']))
              if u.get('best_move') is not None:
                  r['best_move'] = max(float(r.get('best_move', u['best_move'])), float(u['best_move']))
              if u.get('worst_move') is not None:
                  r['worst_move'] = min(float(r.get('worst_move', u['worst_move'])), float(u['worst_move']))

              # Only stamp audit current for a completed row; live/TP1 rows may have newer publisher prices.
              if terminal(str(r.get('status'))) and u.get('current') is not None:
                  r['current'] = u['current']

              after = json.dumps(r, sort_keys=True, separators=(',', ':'))
              if after != before:
                  changed.append(fid)

          if changed:
              d['generated_at'] = datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
              p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('/tmp/changed_ids').write_text('\n'.join(changed), encoding='utf-8')
          print('Changed forecast IDs:', changed)
          PY

          if [ -s /tmp/changed_ids ]; then
            git add forecast-ledger.json
            git commit -m "Synchronize DeepRise PostHog forecast audit lifecycle"
            DATA_SHA=$(git rev-parse HEAD)
            echo "data_sha=$DATA_SHA" >> "$GITHUB_OUTPUT"
            git push origin HEAD:main
          else
            echo "data_sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp per-row proof commits
        if: steps.data.outputs.data_sha != ''
        shell: bash
        env:
          DATA_SHA: ${{ steps.data.outputs.data_sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('forecast-ledger.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          changed=set(Path('/tmp/changed_ids').read_text(encoding='utf-8').splitlines())
          # The first data commit contains every row's current data, so it is also valid for any missing proof row.
          missing={r.get('forecast_id') for r in d.get('records',[]) if r.get('forecast_id') and not r.get('proof_commit')}
          targets=changed|missing
          now=datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
          sha=os.environ['DATA_SHA']
          for r in d.get('records',[]):
              if r.get('forecast_id') in targets:
                  r['proof_commit']=sha
                  r['proof_verified_at']=now
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print('Proof targets:', sorted(targets))
          PY
          git add forecast-ledger.json
          git commit -m "Stamp GitHub proofs for synchronized DeepRise forecasts"
          git push origin HEAD:main
