name: DeepRise Freeze Isolation

# Runtime layer isolation probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deeprise-freeze-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated runtime variants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('index.html').read_text(encoding='utf-8')
          auto='loadMarket();\nsetInterval(loadMarket,60000);'
          if auto in src:
              src=src.replace(auto,"try{document.getElementById('marketRegime').innerHTML='Market: <b>READY</b>'}catch(e){}",1)
          scripts=re.findall(r'<script(?: defer)? src="([^"]+)"[^>]*></script>',src)
          print('SCRIPTS', scripts)
          core_names=('deeprise-fast-search-v160.js','deeprise-v13-gate-hotfix.js')
          groups={
            'core.html':[],
            'ui.html':['mobile-app-v11.js','pwa.js'],
            'legacy.html':['deeprise-v86-upgrade.js','deeprise-intelligence-v11.js','deeprise-v12-experience.js'],
            'product.html':['deeprise-v13-product.js','deeprise-central-forecast-bridge.js','deeprise-predictive-intelligence.js','deeprise-performance.js'],
            'data.html':['deeprise-analytics-config.js','deeprise-analytics.js','deeprise-central-ledger.js'],
            'all.html':['deeprise-v86-upgrade.js','deeprise-intelligence-v11.js','deeprise-v12-experience.js','deeprise-analytics-config.js','deeprise-analytics.js','deeprise-central-ledger.js','deeprise-v13-product.js','deeprise-central-forecast-bridge.js','deeprise-predictive-intelligence.js','deeprise-performance.js','mobile-app-v11.js','pwa.js']
          }
          for name, extras in groups.items():
              keep=core_names+tuple(extras)
              s=src
              def repl(m):
                  url=m.group(1)
                  if 's3.tradingview.com' in url: return m.group(0)
                  return m.group(0) if any(k in url for k in keep) else ''
              s=re.sub(r'<script(?: defer)? src="([^"]+)"[^>]*></script>',repl,s)
              Path(name).write_text(s,encoding='utf-8')
              print(name, [u for u in scripts if any(k in u for k in keep)])
          PY
      - name: Start local app
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          sleep 2
      - name: Install Selenium
        run: python3 -m pip install --quiet selenium
      - name: Create isolated browser probe
        run: |
          cat > /tmp/probe.py <<'PY'
          import sys, shutil, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          name=sys.argv[1]
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          o=Options(); o.binary_location=chrome
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=390,844'] : o.add_argument(a)
          o.add_argument('--user-agent=Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1')
          d=webdriver.Chrome(options=o); w=WebDriverWait(d,35)
          d.get('http://127.0.0.1:4173/'+name+'?isolate=1')
          w.until(EC.presence_of_element_located((By.ID,'search')))
          w.until(lambda x:x.execute_script('return !!window.DeepRiseBinanceUniverse'))
          w.until(lambda x:x.execute_script('return window.DeepRiseBinanceUniverse.state.symbols.length')>=20)
          print(name,'UNIVERSE',d.execute_script('return window.DeepRiseBinanceUniverse.state.symbols.length'),flush=True)
          t=time.time(); r=d.execute_async_script("""
          const done=arguments[arguments.length-1];
          Promise.race([
            window.DeepRiseBinanceUniverse.analyze('BTCUSDT'),
            new Promise(res=>setTimeout(()=>res('TIMEOUT'),12000))
          ]).then(x=>done(x==='TIMEOUT'?'TIMEOUT':(x&&x.symbol||'NULL'))).catch(e=>done('ERR:'+e.message));
          """)
          dt=time.time()-t
          print(name,'ANALYZE',r,'SECONDS',round(dt,2),flush=True)
          assert r=='BTCUSDT', (name,r)
          t=time.time(); ready=d.execute_script('return document.readyState'); dt=time.time()-t
          print(name,'RESPONSIVE',round(dt,3),ready,flush=True)
          assert dt<2
          d.quit()
          PY
      - name: Probe variants independently
        run: |
          set +e
          FAIL=0
          for v in core.html ui.html legacy.html product.html data.html all.html; do
            echo "===== $v ====="
            timeout 50s python3 /tmp/probe.py "$v"
            rc=$?
            echo "RESULT $v rc=$rc"
            if [ "$v" = "core.html" ] && [ $rc -ne 0 ]; then FAIL=1; fi
          done
          exit $FAIL
