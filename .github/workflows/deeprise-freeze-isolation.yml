name: DeepRise Freeze Isolation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deeprise-freeze-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build delayed-freeze variants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('index.html').read_text(encoding='utf-8')
          auto='loadMarket();\nsetInterval(loadMarket,60000);'
          if auto in src:
              src=src.replace(auto,"try{document.getElementById('marketRegime').innerHTML='Market: <b>READY</b>'}catch(e){}",1)
          scripts=re.findall(r'<script(?: defer)? src="([^"]+)"[^>]*></script>',src)
          groups={
            'inline.html':[],
            'fast.html':['deeprise-fast-search-v160.js'],
            'core.html':['deeprise-fast-search-v160.js','deeprise-v13-gate-hotfix.js'],
            'legacy.html':['deeprise-fast-search-v160.js','deeprise-v13-gate-hotfix.js','deeprise-v86-upgrade.js','deeprise-intelligence-v11.js','deeprise-v12-experience.js'],
            'data.html':['deeprise-fast-search-v160.js','deeprise-v13-gate-hotfix.js','deeprise-analytics-config.js','deeprise-analytics.js','deeprise-central-ledger.js'],
            'product.html':['deeprise-fast-search-v160.js','deeprise-v13-gate-hotfix.js','deeprise-v13-product.js','deeprise-central-forecast-bridge.js','deeprise-predictive-intelligence.js','deeprise-performance.js'],
            'ui.html':['deeprise-fast-search-v160.js','deeprise-v13-gate-hotfix.js','mobile-app-v11.js','pwa.js'],
            'all-index.html':['deeprise-fast-search-v160.js','deeprise-v86-upgrade.js','deeprise-intelligence-v11.js','deeprise-v12-experience.js','deeprise-analytics-config.js','deeprise-analytics.js','deeprise-central-ledger.js','deeprise-v13-product.js','deeprise-central-forecast-bridge.js','deeprise-predictive-intelligence.js','deeprise-performance.js','deeprise-v13-gate-hotfix.js','mobile-app-v11.js','pwa.js']
          }
          for name,keep in groups.items():
              def repl(m):
                  u=m.group(1)
                  if 's3.tradingview.com' in u: return ''
                  return m.group(0) if any(k in u for k in keep) else ''
              out=re.sub(r'<script(?: defer)? src="([^"]+)"[^>]*></script>',repl,src)
              Path(name).write_text(out,encoding='utf-8')
              print(name,[u for u in scripts if any(k in u for k in keep)])
          PY
      - name: Start local app
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          sleep 2
      - name: Install Selenium
        run: python3 -m pip install --quiet selenium
      - name: Create delayed responsiveness probe
        run: |
          cat > /tmp/probe.py <<'PY'
          import sys,shutil,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          name=sys.argv[1]
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          o=Options();o.binary_location=chrome
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=390,844']:o.add_argument(a)
          o.add_argument('--user-agent=Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1')
          d=webdriver.Chrome(options=o);w=WebDriverWait(d,20)
          d.get('http://127.0.0.1:4173/'+name+'?delayprobe=1')
          w.until(EC.presence_of_element_located((By.ID,'search')))
          print(name,'BOOT',flush=True)
          time.sleep(15)
          t=time.time();state=d.execute_script('return document.readyState');dt=time.time()-t
          print(name,'AFTER15',round(dt,3),state,flush=True)
          assert dt<2
          if 'fast' in name or name not in ('inline.html',):
              try:
                  n=d.execute_script('return window.DeepRiseBinanceUniverse?.state?.symbols?.length||0')
                  print(name,'UNIVERSE',n,flush=True)
              except Exception as e: print(name,'UNIVERSE_ERR',e,flush=True)
          d.quit()
          PY
      - name: Probe delayed freeze by script group
        run: |
          set +e
          for v in inline.html fast.html core.html legacy.html data.html product.html ui.html all-index.html; do
            echo "===== $v ====="
            timeout 35s python3 /tmp/probe.py "$v"
            echo "RESULT $v rc=$?"
          done
          exit 0
