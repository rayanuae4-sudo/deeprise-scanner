name: DeepRise Final Runtime Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deeprise-final-runtime-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch runtime without changing layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='loadMarket();\nsetInterval(loadMarket,60000);'
          safe='''try{\n const r=document.getElementById("results"),t=document.getElementById("top3"),m=document.getElementById("marketRegime");\n if(r)r.innerHTML='<div class="loading">Loading Binance markets…</div>';\n if(t)t.innerHTML='<div class="loading">Tap ⚡ DEEP SCAN to build Top Setups.</div>';\n if(m)m.innerHTML='Market: <b class="yellow">READY</b>';\n}catch(e){}'''
          if old in s:s=s.replace(old,safe,1)
          s=s.replace('<button onclick="loadMarket()">⚡ DEEP SCAN</button>','<button onclick="window.DeepRiseBinanceUniverse?.refresh?window.DeepRiseBinanceUniverse.refresh():loadMarket()">⚡ DEEP SCAN</button>')
          for a,b in [('deeprise-fast-search-v160.js?v=1601','deeprise-fast-search-v160.js?v=1651'),('deeprise-v13-gate-hotfix.js?v=1310','deeprise-v13-gate-hotfix.js?v=1651'),('deeprise-v13-product.js?v=1310','deeprise-v13-product.js?v=1651'),('deeprise-analytics-config.js?v=1310','deeprise-analytics-config.js?v=1651'),('pwa.js?v=1310','pwa.js?v=1651')]:s=s.replace(a,b)
          assert 'setInterval(loadMarket,60000)' not in s and 'window.DeepRiseBinanceUniverse?.refresh' in s
          p.write_text(s,encoding='utf-8')

          p=Path('deeprise-v13-gate-hotfix.js');s=p.read_text(encoding='utf-8')
          s=s.replace('const concurrency=MOBILE?3:4;','const concurrency=MOBILE?2:3;')
          s=s.replace('await Promise.allSettled(wanted.slice(i,i+concurrency).map(x=>ensureAnalyzed(x.symbol,true)));if(paint&&i===0){','await Promise.allSettled(wanted.slice(i,i+concurrency).map(x=>ensureAnalyzed(x.symbol,false)));await new Promise(r=>setTimeout(r,MOBILE?45:20));if(paint&&i===0){')
          s=s.replace('await deepSweep(MOBILE?18:26,true);','await deepSweep(MOBILE?10:14,true);').replace('await deepSweep(MOBILE?8:18,false);','await deepSweep(MOBILE?6:10,false);')
          assert 'finally{state.loading=false;try{scanRunning=false}catch(e){}}' in s
          p.write_text(s,encoding='utf-8')

          p=Path('deeprise-early-breakout-v160.js');s=p.read_text(encoding='utf-8')
          old="let mo=null;function boot(){addUi();render();decorate();setTimeout(scan,2500);state.timer=setInterval(scan,SCAN_MS);setInterval(addUi,5000);mo=new MutationObserver(()=>decorate());mo.observe(document.getElementById('results')||document.body,{childList:true,subtree:true})}"
          new="let mo=null;function boot(){addUi();render();decorate();setTimeout(scan,2500);state.timer=setInterval(scan,SCAN_MS);setInterval(addUi,5000);const target=document.getElementById('results')||document.body;let queued=false;mo=new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;try{mo.disconnect();decorate()}finally{mo.observe(target,{childList:true,subtree:true})}})});mo.observe(target,{childList:true,subtree:true})}"
          if old in s:s=s.replace(old,new,1)
          assert 'try{mo.disconnect();decorate()}finally{mo.observe(target' in s
          p.write_text(s,encoding='utf-8')

          p=Path('deeprise-analytics-config.js');s=p.read_text(encoding='utf-8').replace('deeprise-early-breakout-v160.js?v=1600','deeprise-early-breakout-v160.js?v=1601');p.write_text(s,encoding='utf-8')

          p=Path('pwa.js');s=p.read_text(encoding='utf-8')
          old="addEventListener('load',()=>{brand();languagePerformancePatch();idle(button,1800);progressiveLayers()},{once:true});"
          new="window.DeepRiseLoadOptionalLayers=progressiveLayers;addEventListener('load',()=>{brand();languagePerformancePatch();idle(button,1800)},{once:true});"
          if old in s:s=s.replace(old,new,1)
          assert 'idle(button,1800);progressiveLayers()' not in s
          p.write_text(s,encoding='utf-8')

          p=Path('deeprise-v13-product.js');s=p.read_text(encoding='utf-8').replace('setInterval(refreshCards,5000);',"setInterval(()=>{try{if(typeof scanRunning==='undefined'||!scanRunning)refreshCards()}catch(e){refreshCards()}},7000);");p.write_text(s,encoding='utf-8')

          p=Path('stable-loader.js');s=p.read_text(encoding='utf-8')
          s=s.replace('DeepRise Stable Loader v16.4.1','DeepRise Stable Loader v16.5.1').replace('DeepRise Stable Loader v16.5.0','DeepRise Stable Loader v16.5.1')
          s=s.replace('./index.html?stable=16.4.1&t=','./index.html?stable=16.5.1&t=').replace('./index.html?stable=16.5.0&t=','./index.html?stable=16.5.1&t=')
          s=s.replace("if(!startup.test(html))throw new Error('startup marker not found');\n    const safe=",'const safe=').replace('    html=html.replace(startup,safe);','    if(startup.test(html))html=html.replace(startup,safe);')
          for a,b in [('deeprise-fast-search-v160.js?v=1641','deeprise-fast-search-v160.js?v=1651'),('deeprise-v13-gate-hotfix.js?v=1641','deeprise-v13-gate-hotfix.js?v=1651'),('deeprise-v13-product.js?v=1310','deeprise-v13-product.js?v=1651'),('deeprise-analytics-config.js?v=1310','deeprise-analytics-config.js?v=1651'),('pwa.js?v=1641','pwa.js?v=1651')]:s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')

          p=Path('stable.html');p.write_text(p.read_text(encoding='utf-8').replace('stable-loader.js?v=1641','stable-loader.js?v=1651').replace('stable-loader.js?v=1650','stable-loader.js?v=1651'),encoding='utf-8')
          p=Path('manifest.json');p.write_text(p.read_text(encoding='utf-8').replace('./stable.html?source=pwa&v=16.4.1','./stable.html?source=pwa&v=16.5.1').replace('./stable.html?source=pwa&v=16.5.0','./stable.html?source=pwa&v=16.5.1'),encoding='utf-8')
          p=Path('recover.html');p.write_text(p.read_text(encoding='utf-8').replace('./stable.html?source=repair&v=16.4.1&t=','./stable.html?source=repair&v=16.5.1&t=').replace('./stable.html?source=repair&v=16.5.0&t=','./stable.html?source=repair&v=16.5.1&t='),encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check deeprise-fast-search-v160.js
          node --check deeprise-v13-gate-hotfix.js
          node --check deeprise-early-breakout-v160.js
          node --check deeprise-analytics-config.js
          node --check deeprise-v13-product.js
          node --check stable-loader.js
          node --check pwa.js

      - name: Start local app
        run: |
          python3 -m http.server 4173 >/tmp/deeprise-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          curl -fsS http://127.0.0.1:4173/stable.html >/dev/null

      - name: Install Selenium
        run: python3 -m pip install --quiet selenium

      - name: Full mobile browser regression
        run: |
          python3 - <<'PY'
          import shutil,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait,Select
          from selenium.webdriver.support import expected_conditions as EC
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser');assert chrome
          o=Options();o.binary_location=chrome
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=390,844']:o.add_argument(a)
          o.add_argument('--user-agent=Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1')
          o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(options=o);w=WebDriverWait(d,100)
          def responsive():
              t=time.time();state=d.execute_script('return document.readyState');dt=time.time()-t
              assert state in ('interactive','complete') and dt<2,(state,dt)
          def boot(url):
              d.get(url);w.until(EC.presence_of_element_located((By.ID,'search')))
              w.until(lambda x:x.execute_script('return !!window.DeepRiseBinanceUniverse'))
              w.until(lambda x:x.execute_script('return window.DeepRiseBinanceUniverse.state.symbols.length')>=20)
              assert len(d.find_elements(By.CSS_SELECTOR,'.dr-market-card'))>=10
              assert d.execute_script('return window.DeepRiseBinanceUniverse.state.analyzed.size')==0
              w.until(lambda x:x.execute_script('return !!window.DeepRiseEarlyBreakout'))
              w.until(lambda x:x.execute_script('return window.DeepRiseEarlyBreakout.state.lastScan>0'))
              responsive();time.sleep(3);responsive()
              assert d.execute_script("return [...document.scripts].filter(s=>/deeprise-next-candle-v145|deeprise-whale-inline-v156/.test(s.src)).length")==0
          def search():
              q=d.find_element(By.ID,'search');q.clear();q.send_keys('BTC')
              w.until(lambda x:'BTC/USDT' in x.find_element(By.ID,'results').text)
              w.until(lambda x:x.execute_script("return window.DeepRiseBinanceUniverse.state.analyzed.has('BTCUSDT')"));responsive()
          boot('http://127.0.0.1:4173/index.html?smoke=1651');search()
          Select(d.find_element(By.ID,'languageSelect')).select_by_value('ar');w.until(lambda x:x.find_element(By.TAG_NAME,'html').get_attribute('dir')=='rtl')
          Select(d.find_element(By.ID,'languageSelect')).select_by_value('en');responsive()
          q=d.find_element(By.ID,'search');q.clear();d.execute_script("arguments[0].dispatchEvent(new Event('input',{bubbles:true}))",q)
          b=d.find_element(By.XPATH,"//button[contains(.,'DEEP SCAN')]");d.execute_script('arguments[0].click()',b)
          w.until(lambda x:x.execute_script('return window.DeepRiseBinanceUniverse.state.analyzed.size')>=3);responsive()
          w.until(lambda x:x.execute_script("return typeof scanRunning!=='undefined'&&scanRunning===false"));assert d.execute_script('return window.DeepRiseBinanceUniverse.state.analyzed.size')>=6;responsive()
          first=d.find_element(By.CSS_SELECTOR,'[data-open-symbol]');d.execute_script('arguments[0].click()',first)
          w.until(lambda x:'active' in x.find_element(By.ID,'chartPanel').get_attribute('class'));w.until(lambda x:len(x.find_element(By.ID,'tradingview_chart').get_attribute('innerHTML'))>0);responsive();print('ROOT PASS',flush=True)
          boot('http://127.0.0.1:4173/stable.html?smoke=1651');search();print('STABLE PASS',flush=True)
          bad=[]
          ignore=['favicon','tradingview','ERR_BLOCKED_BY_CLIENT','ERR_CONNECTION_CLOSED','api.binance.com','fapi.binance.com']
          for r in d.get_log('browser'):
              if r.get('level')=='SEVERE' and not any(x in r.get('message','') for x in ignore):bad.append(r.get('message',''))
          assert not bad,'console errors: '+' | '.join(bad[:5])
          d.quit();print('DEEPRISE FINAL MOBILE REGRESSION PASS',flush=True)
          PY

      - name: Commit runtime only after PASS
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html deeprise-v13-gate-hotfix.js deeprise-early-breakout-v160.js deeprise-analytics-config.js deeprise-v13-product.js pwa.js stable-loader.js stable.html manifest.json recover.html
          git commit -m 'Fix delayed scanner freeze and stabilize mobile runtime'
          git pull --rebase origin main
          git push
