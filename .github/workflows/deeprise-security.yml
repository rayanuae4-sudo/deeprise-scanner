name: DeepRise Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-and-policy-scan:
    name: Secret and policy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for high-risk credential patterns
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys

          tracked = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          skip = {'.github/workflows/deeprise-security.yml'}
          patterns = {
              'private key block': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'),
              'GitHub personal token': re.compile(r'\bgh[pousr]_[A-Za-z0-9]{30,}\b'),
              'Stripe secret/restricted key': re.compile(r'\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}\b'),
              'AWS access key id': re.compile(r'\bAKIA[0-9A-Z]{16}\b'),
              'Slack token': re.compile(r'\bxox[baprs]-[A-Za-z0-9-]{20,}\b'),
              'Google API key': re.compile(r'\bAIza[0-9A-Za-z_-]{30,}\b'),
          }
          findings=[]
          for name in tracked:
              if name in skip:
                  continue
              p=pathlib.Path(name)
              try:
                  data=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              for label, rx in patterns.items():
                  for m in rx.finditer(data):
                      line=data.count('\n',0,m.start())+1
                      findings.append((name,line,label))
          if findings:
              for f in findings:
                  print(f'::error file={f[0]},line={f[1]}::Potential {f[2]} committed to repository')
              sys.exit(1)
          print('No high-risk literal credential patterns found in tracked files.')
          PY

      - name: Reject dangerous workflow-wide permissions
        shell: bash
        run: |
          if grep -RInE '^permissions:[[:space:]]*write-all[[:space:]]*$' .github/workflows; then
            echo '::error::permissions: write-all is forbidden'
            exit 1
          fi
          echo 'No workflow uses permissions: write-all.'

      - name: Validate production JavaScript syntax
        shell: bash
        run: |
          for f in *.js; do
            [ -f "$f" ] && node --check "$f"
          done

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
