name: DeepRise Production Index Builder

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core-v85.html'
      - '.github/workflows/deeprise-production-index.yml'

permissions:
  contents: write

concurrency:
  group: deeprise-production-index
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build direct V13.1 production HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core-v85.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>DeepRise V8.5 PRO</title>','<title>DeepRise V13.1 PRO</title>')
          s=s.replace('⚡ DeepRise V8.5 PRO','⚡ DeepRise V13.1 PRO')
          s=s.replace('Engine: <b>V8.5 PRO</b>','Engine: <b>V13.1 PRO</b>')
          s=s.replace('DeepRise V8.5 PRO analyses public market data.','DeepRise V13.1 PRO analyses public market data.')
          s=s.replace('const API="https://api.binance.com",FAPI="https://fapi.binance.com";','const API="https://data-api.binance.vision",FAPI="https://fapi.binance.com";')

          # Mobile startup: TradingView downloads in parallel instead of blocking the scanner bootstrap.
          s=s.replace('<script src="https://s3.tradingview.com/tv.js"></script>','<script defer src="https://s3.tradingview.com/tv.js"></script>')

          # Scanner startup: analyse more coins per network round and paint progressively after each batch.
          s=s.replace('for(let i=0;i<universe.length;i+=5){','for(let i=0;i<universe.length;i+=8){')
          s=s.replace('universe.slice(i,i+5).map(analyseCoin)','universe.slice(i,i+8).map(analyseCoin)')
          s=s.replace('Math.min(i+5,universe.length)','Math.min(i+8,universe.length)')
          s=s.replace('output.push(...batch.filter(Boolean));bar.style.width=','output.push(...batch.filter(Boolean));marketData=[...output].sort((a,b)=>b.score-a.score);updateBTC();render();bar.style.width=')

          head='''<meta name="theme-color" content="#050d18"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="DeepRise"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="mobile-app-v11.css?v=1310">'''
          scripts='''<script src="deeprise-fast-search-v160.js?v=1601"></script><script defer src="deeprise-v86-upgrade.js?v=1310"></script><script defer src="deeprise-intelligence-v11.js?v=1310"></script><script defer src="deeprise-v12-experience.js?v=1310"></script><script defer src="deeprise-analytics-config.js?v=1310"></script><script defer src="deeprise-analytics.js?v=1310"></script><script defer src="deeprise-central-ledger.js?v=1310"></script><script defer src="deeprise-v13-product.js?v=1310"></script><script defer src="deeprise-central-forecast-bridge.js?v=1310"></script><script defer src="deeprise-predictive-intelligence.js?v=1310"></script><script defer src="deeprise-performance.js?v=1310"></script><script defer src="deeprise-v13-gate-hotfix.js?v=1310"></script><script defer src="mobile-app-v11.js?v=1310"></script><script defer src="pwa.js?v=1310"></script>'''
          if 'mobile-app-v11.css?v=1310' not in s:
              s=s.replace('</head>',head+'</head>')
          if 'deeprise-predictive-intelligence.js?v=1310' not in s:
              s=s.replace('</body>',scripts+'</body>')
          else:
              # Existing production source may already contain the old footer bundle; replace it with the optimized one.
              import re
              s=re.sub(r'<script src="deeprise-v86-upgrade\.js\?v=1310"></script>.*?<script src="pwa\.js\?v=1310"></script>',scripts,s,flags=re.S)
          Path('index.html').write_text(s,encoding='utf-8')
          PY

      - name: Assert direct production runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert len(s)>45000, 'production index is still a loader/wrapper'
          assert 'document.write' not in s, 'document.write loader must not ship'
          assert 'https://data-api.binance.vision' in s, 'stable Binance spot endpoint missing'
          assert 'deeprise-fast-search-v160.js?v=1601' in s, 'instant search layer missing'
          assert '<script defer src="https://s3.tradingview.com/tv.js"></script>' in s, 'TradingView must not block startup'
          assert 'universe.length;i+=8' in s, 'progressive scan batching missing'
          for x in ['deeprise-central-forecast-bridge.js','deeprise-predictive-intelligence.js','deeprise-performance.js','deeprise-v13-product.js']:
              assert x in s, f'missing {x}'
          PY

      - name: Commit production index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build optimized DeepRise V13.1 production index"
          git push