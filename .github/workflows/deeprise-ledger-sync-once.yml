name: DeepRise Ledger Audit Sync Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deeprise-ledger-sync-once.yml'

permissions:
  contents: write

jobs:
  repair-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current audit data and stamp proof SHA
        shell: bash
        env:
          PROOF_SHA: 7895b93e2718b6a34e8bfbd075b196341d532719
        run: |
          python3 - <<'PY'
          import json, datetime, os, subprocess
          path='forecast-ledger.json'
          proof=os.environ['PROOF_SHA']
          # Require the proof commit to exist locally and to contain the ledger file.
          subprocess.run(['git','cat-file','-e',f'{proof}:forecast-ledger.json'],check=True)
          expected={
            '2026-09-01-0GUSDT': {'status':'TP2 HIT','final_move':3.6833192209991585,'end_reason':'TP2 HIT'},
            '2026-09-01-UNIUSDT': {'status':'STOP HIT','final_move':-0.8453879391320837,'end_reason':'STOP HIT'},
            '2026-09-01-DOGEUSDT': {'status':'STOP HIT','final_move':-0.25313404050143196,'end_reason':'STOP HIT'},
            '2026-09-01-BTCUSDT': {'status':'STOP AFTER TP1','final_move':-0.19123928286729228,'end_reason':'STOP AFTER TP1'}
          }
          with open(path,encoding='utf-8') as f: data=json.load(f)
          proof_data=json.loads(subprocess.check_output(['git','show',f'{proof}:forecast-ledger.json'],text=True))
          cur={r.get('forecast_id'):r for r in data.get('records',[])}
          old={r.get('forecast_id'):r for r in proof_data.get('records',[])}
          immutable=('created_at','entry','tp1','tp2','sl','symbol','side')
          for fid, fields in expected.items():
              if fid not in cur or fid not in old:
                  raise SystemExit(f'Missing {fid} in current/proof ledger')
              for k,v in fields.items():
                  if cur[fid].get(k)!=v or old[fid].get(k)!=v:
                      raise SystemExit(f'Proof mismatch {fid} {k}: current={cur[fid].get(k)!r} proof={old[fid].get(k)!r} expected={v!r}')
              for k in immutable:
                  if cur[fid].get(k)!=old[fid].get(k):
                      raise SystemExit(f'Immutable mismatch for {fid} {k}')
          now=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
          stamped=[]
          for fid in expected:
              r=cur[fid]
              if r.get('proof_commit')!=proof:
                  r['proof_commit']=proof
                  r['proof_verified_at']=now
                  stamped.append(fid)
          with open(path,'w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2); f.write('\n')
          print('verified proof commit', proof)
          print('stamped', stamped)
          PY
          git config user.name 'DeepRise Ledger Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add forecast-ledger.json
          if git diff --cached --quiet; then
            echo 'No proof repair required.'
            exit 0
          fi
          git commit -m 'Stamp DeepRise per-row proof commits for 2026-09-01'
          git push origin HEAD:main
          echo "PROOF_STAMP_COMMIT=$(git rev-parse HEAD)"
