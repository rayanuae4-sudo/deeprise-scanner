name: DeepRise Central Forecast Publisher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_forecasts.py'
      - 'scripts/apply_trap_gate.py'
      - 'scripts/publish_liquidity_alerts.py'
      - 'scripts/enrich_smart_money.py'
      - 'scripts/publish_whale_radar.py'
      - 'scripts/publish_public_liquidity.py'
      - 'scripts/apply_whale_gate.py'
      - 'scripts/maintain_ledger.py'
      - 'whale-radar.json'
      - 'public-liquidity.json'
      - '.github/workflows/deeprise-ledger-maintenance.yml'

permissions:
  contents: write

concurrency:
  group: deeprise-central-ledger
  cancel-in-progress: false

jobs:
  publish-and-maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish public Whale Arrival Radar
        env:
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
        run: python3 scripts/publish_whale_radar.py

      - name: Publish public liquidity fallback
        run: python3 scripts/publish_public_liquidity.py

      - name: Publish new official forecasts from predictive confluence
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
        run: python3 scripts/publish_forecasts.py

      - name: Block new LONG forecasts caught in upward liquidity sweep traps
        run: python3 scripts/apply_trap_gate.py

      - name: Enrich newly created forecasts with Smart Money and whale divergence
        env:
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
        run: python3 scripts/enrich_smart_money.py

      - name: Apply fresh whale-arrival confluence and conflict gate
        run: python3 scripts/apply_whale_gate.py

      - name: Publish scanner-wide liquidity sweep alerts
        run: python3 scripts/publish_liquidity_alerts.py

      - name: Maintain open forecast lifecycle from Binance 1m candles
        run: python3 scripts/maintain_ledger.py

      - name: Commit central forecasts alerts whale radar public liquidity and lifecycle changes
        id: ledger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast-ledger.json market-alerts.json whale-radar.json public-liquidity.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish DeepRise forecasts whale radar public liquidity and alerts"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "proof_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp GitHub proof on new forecasts and lifecycle transitions
        if: steps.ledger.outputs.changed == 'true'
        env:
          PROOF_SHA: ${{ steps.ledger.outputs.proof_sha }}
        run: |
          python3 scripts/publish_forecasts.py stamp
          python3 scripts/maintain_ledger.py stamp
          git add forecast-ledger.json
          git diff --cached --quiet || git commit -m "Stamp DeepRise central forecast proof"

      - name: Rebase on latest main and push authoritative central data
        if: steps.ledger.outputs.changed == 'true'
        run: |
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
