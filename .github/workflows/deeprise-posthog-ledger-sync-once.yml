name: DeepRise PostHog Ledger Sync Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deeprise-posthog-ledger-sync-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deeprise-posthog-ledger-sync-once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Apply verified PostHog audit enrichment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('forecast-ledger.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          updates = {
              '2026-08-30-UNIUSDT':  {'final_move': 1.8062397372742216,  'end_reason': 'TP2 HIT'},
              '2026-08-30-ENAUSDT':  {'final_move': 1.6917293233082755,  'end_reason': 'TP2 HIT'},
              '2026-08-30-PROMUSDT': {'final_move': 4.6650393273664275,  'end_reason': 'TP2 HIT'},
              '2026-08-30-DOGEUSDT': {'final_move': -0.2354603249352388, 'end_reason': 'STOP HIT'},
              '2026-08-30-PUMPUSDT': {'final_move': -1.637726913970003,  'end_reason': 'STOP HIT'},
          }
          by_id = {r.get('forecast_id'): r for r in d.get('records', [])}
          changed=[]
          for fid, vals in updates.items():
              r=by_id.get(fid)
              if not r:
                  raise SystemExit(f'Missing expected forecast row: {fid}')
              for k,v in vals.items():
                  if r.get(k) != v:
                      r[k]=v
                      if fid not in changed: changed.append(fid)
          if not changed:
              Path('/tmp/deeprise_changed').write_text('', encoding='utf-8')
              raise SystemExit(0)
          d['generated_at']=datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          Path('/tmp/deeprise_changed').write_text('\n'.join(changed), encoding='utf-8')
          PY
          if [ ! -s /tmp/deeprise_changed ]; then
            echo "No ledger audit changes required."
            exit 0
          fi
          git add forecast-ledger.json
          git commit -m "Sync Aug 30 DeepRise forecast audit outcomes"
          DATA_SHA=$(git rev-parse HEAD)
          git push origin HEAD:main
          echo "$DATA_SHA" > /tmp/deeprise_data_sha

      - name: Stamp per-row proof commit
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/deeprise_data_sha ]; then exit 0; fi
          DATA_SHA=$(cat /tmp/deeprise_data_sha)
          VERIFIED_AT=$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')
          python3 - "$DATA_SHA" "$VERIFIED_AT" <<'PY'
          import json, sys
          from pathlib import Path
          data_sha, verified_at=sys.argv[1],sys.argv[2]
          p=Path('forecast-ledger.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          changed=set(Path('/tmp/deeprise_changed').read_text(encoding='utf-8').splitlines())
          for r in d.get('records',[]):
              if r.get('forecast_id') in changed:
                  r['proof_commit']=data_sha
                  r['proof_verified_at']=verified_at
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          git add forecast-ledger.json
          git commit -m "Stamp GitHub proof for Aug 30 forecast audit sync"
          git push origin HEAD:main
