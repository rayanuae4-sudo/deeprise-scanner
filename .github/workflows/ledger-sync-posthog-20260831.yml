name: DeepRise PostHog Proof Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ledger-sync-posthog-20260831.yml'

permissions:
  contents: write

jobs:
  recover-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stamp verified proof commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          export DATA_SHA=c3e388848dbcd37f9ccc818afbe7afe8d87b0194
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          p=Path('forecast-ledger.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          data_sha=os.environ['DATA_SHA']
          now=datetime.now(timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
          changed_ids={'2026-08-31-LINKUSDT','2026-08-31-PUMPUSDT'}
          compare_fields=('forecast_id','created_at','entry','tp1','tp2','sl','symbol','side','status','score','rank','day','current','high','low','final_move','best_move','worst_move','end_reason','tp1_hit_at','tp2_hit_at','ended_at')

          def load_at(sha):
              raw=subprocess.check_output(['git','show',f'{sha}:forecast-ledger.json'],text=True)
              x=json.loads(raw)
              return {str(r.get('forecast_id')):r for r in x.get('records',[]) if r.get('forecast_id')}
          proof_rows=load_at(data_sha)
          current={str(r.get('forecast_id')):r for r in d.get('records',[]) if r.get('forecast_id')}
          def matches(a,b): return all(a.get(k)==b.get(k) for k in compare_fields)

          for fid in changed_ids:
              if fid not in current or fid not in proof_rows:
                  raise SystemExit(f'proof validation row missing: {fid}')
              if not matches(proof_rows[fid],current[fid]):
                  raise SystemExit(f'proof commit does not contain current lifecycle/audit data: {fid}')

          proof_changed=False
          for fid in changed_ids:
              r=current[fid]
              if r.get('proof_commit')!=data_sha:
                  r['proof_commit']=data_sha
                  r['proof_verified_at']=now
                  proof_changed=True

          # Repair any rows that still have no proof by finding the newest historical
          # ledger commit that already contains their current lifecycle/audit data.
          missing=[r for r in d.get('records',[]) if r.get('forecast_id') and not r.get('proof_commit')]
          if missing:
              commits=subprocess.check_output(['git','log','--format=%H','--','forecast-ledger.json'],text=True).splitlines()
              cache={}
              for r in missing:
                  fid=str(r['forecast_id']); found=None
                  for sha in commits:
                      if sha not in cache:
                          try: cache[sha]=load_at(sha)
                          except Exception: cache[sha]={}
                      old=cache[sha].get(fid)
                      if old and matches(old,r):
                          found=sha; break
                  if not found:
                      raise SystemExit(f'no historical proof commit found for {fid}')
                  r['proof_commit']=found
                  r['proof_verified_at']=now
                  proof_changed=True

          if proof_changed:
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('.proof_changed').write_text('1' if proof_changed else '0')
          PY
          if [ "$(cat .proof_changed)" = "1" ]; then
            git add forecast-ledger.json
            git commit -m "Stamp DeepRise per-row GitHub proof commits"
            git push origin HEAD:main
          fi
