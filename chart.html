<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050d18"><title>DeepRise | Interactive Market Structure Chart</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#050d18;color:#e1f1fc;font:14px system-ui,-apple-system,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:#73c4fd;text-decoration:none}
.chart-top{position:sticky;top:0;z-index:15;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;background:#081827;border-bottom:1px solid #244459;padding:12px max(12px,env(safe-area-inset-right))}.chart-top>b{font-size:18px}.chart-top form{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.chart-top input{background:#102537;border:1px solid #35546a;color:#fff;border-radius:8px;min-width:120px;width:144px;padding:10px}.chart-top button,.chart-top a{background:#123b35;border:1px solid #4cbf9d;color:#d6ffef;padding:10px 13px;border-radius:8px}
main{padding:0 8px 14px}.help{padding:8px 12px;color:#95acbd;font-size:12px}.chart-panel{display:block;overflow:visible!important;background:#071421;border:1px solid #21415b;border-radius:10px}.chart-head,#tradingview_chart{display:none!important}
.dr-structure-panel{border-top:0!important}.dr-structure-scroll{min-height:52vh}.dr-structure-scroll svg{touch-action:none!important}.dr-structure-head b{font-size:17px}
#standaloneStatus{color:#9abed0;font-size:12px;padding:6px 12px}
@media(max-width:640px){.chart-top{position:static}.chart-top form{width:100%}.chart-top input{flex:1;width:100px}.dr-structure-scroll{min-height:40vh}}
</style>
</head><body>
<header class="chart-top"><b>⚡ DeepRise · Interactive Chart</b><form id="symbolForm"><label for="coinSymbol">Symbol</label><input id="coinSymbol" name="symbol" value="BTCUSDT" autocomplete="off" inputmode="latin" autocapitalize="characters" aria-label="Trading pair"><button type="submit">Open</button><a href="./index.html">← Scanner</a></form></header>
<main><p class="help">Tap indicators to show or hide them. Use Full screen for the marked chart, pinch to zoom, and tap drawing tools to mark levels.</p>
<div id="standaloneStatus" role="status" aria-live="polite"></div>
<div id="chartPanel" class="chart-panel active dr-view-structure"><div class="chart-head"><span id="chartTitle">Interactive chart</span></div><div id="tradingview_chart"></div></div>
</main>
<script defer src="./deeprise-market-structure-v174.js?v=1740"></script>
<script defer src="./deeprise-structure-chart-v174.js?v=1760"></script>
<script defer>
(function(){
 const p=new URLSearchParams(location.search), input=document.getElementById('coinSymbol'), status=document.getElementById('standaloneStatus');
 const sym=String(p.get('symbol')||'BTCUSDT').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
 const tf=/^(5m|15m|1h|4h|1d)$/.test(p.get('tf')||'')?p.get('tf'):'4h';
 input.value=sym;
 const tr={en:{pan:'Move',line:'Trendline',horizontal:'Horizontal',rectangle:'Zone',drawFib:'Draw Fib',undo:'Undo',clear:'Clear',cancel:'Cancel',fit:'Reset',older:'Older',newer:'Newer',bars:'candles',zoomIn:'Zoom in',zoomOut:'Zoom out',layers:'Automatic tools',drawings:'Drawing tools',hint:'Drag to pan, pinch to zoom, tap 2 points to draw.',pending:'Choose second point'},ar:{pan:'تحريك',line:'ترند',horizontal:'أفقي',rectangle:'منطقة',drawFib:'رسم فيبوناتشي',undo:'تراجع',clear:'مسح',cancel:'إلغاء',fit:'إعادة ضبط',older:'أقدم',newer:'أحدث',bars:'شمعة',zoomIn:'تكبير',zoomOut:'تصغير',layers:'الأدوات الآلية',drawings:'أدوات الرسم',hint:'اسحب للتحريك، إصبعان للتكبير، ونقطتان للرسم.',pending:'اختر النقطة الثانية'}};
 const lang=p.get('lang')||localStorage.getItem('deeprise_language')||'en';try{localStorage.setItem('deeprise_language',lang)}catch(e){}
 window.DeepRiseWorkspace={t:k=>(tr[lang]||tr.en)[k]||tr.en[k]||k};
 const start=(s,f)=>{document.getElementById('chartTitle').textContent=s+' · '+f;status.textContent=s+' · '+f+' · loaded by DeepRise';window.DeepRiseStructureChart?.load(s,f)};
 document.getElementById('symbolForm').addEventListener('submit',e=>{e.preventDefault();const s=input.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase();if(!s)return;history.replaceState(null,'','./chart.html?symbol='+encodeURIComponent(s)+'&tf='+encodeURIComponent(window.DeepRiseStructureChart?.state.tf||tf));start(s,window.DeepRiseStructureChart?.state.tf||tf)});
 const boot=()=>{if(window.DeepRiseStructureChart&&window.DeepRiseStructure)start(sym,tf);else status.textContent='Chart scripts did not load. Refresh or return to scanner.'};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
</body></html>
